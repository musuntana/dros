name: Scientific Phase 0 Offline Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install "pytest>=8.3,<9"
      - name: Test standalone nf-core evidence contract (no real Nextflow)
        run: python -m pytest -q tests/test_rnaseq_phase0.py
